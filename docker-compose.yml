services:

  minio:
    image: adobe/s3mock:latest
    environment:
      initialBuckets: ${MINIO_BUCKET:-minecraft-backups}
      INITIAL_BUCKETS: ${MINIO_BUCKET:-minecraft-backups}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9090}:9090"
      - "127.0.0.1:9191:9191"
    networks:
      - cloudnet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    networks:
      - cloudnet
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9090 s3 ls 2>/dev/null; do echo 'Waiting for s3mock...'; sleep 2; done &&
      aws --endpoint-url http://minio:9090 s3 mb s3://${MINIO_BUCKET:-minecraft-backups} 2>/dev/null || echo 'Bucket already exists or created by initialBuckets'
      "
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "10001:${DOCKER_GID:-10001}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-minecraft-backups}
      MINIO_ENDPOINT: http://minio:9090
    volumes:
      - backend_data:/data
      - backup_scratch:/tmp/scratch
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudnet
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: ${MC_CONTAINER_NAME:-cloud-minecraft}
    environment:
      EULA: "TRUE"
      VERSION: ${MC_VERSION:-1.20.4}
      MEMORY: ${MC_MEMORY:-2G}
      MAX_PLAYERS: ${MC_MAX_PLAYERS:-20}
      ONLINE_MODE: ${MINECRAFT_ONLINE_MODE:-true}
      ENFORCE_SECURE_PROFILE: ${ENFORCE_SECURE_PROFILE:-false}
      OVERRIDE_SERVER_PROPERTIES: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
      RCON_PORT: 25575
      TYPE: PAPER
      PLUGIN_API_KEY: ${PLUGIN_API_KEY}

    ports:
      - "${MC_PORT:-25565}:25565"
      - "127.0.0.1:${RCON_PORT:-25575}:25575"
    volumes:
      - mc_data:/data
    networks:
      - cloudnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - cloudnet
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloud-web-tunnel
    command: tunnel --no-autoupdate --url http://frontend:80
    networks:
      - cloudnet
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  backend_data:
  backup_scratch:
  mc_data:

networks:
  cloudnet:

